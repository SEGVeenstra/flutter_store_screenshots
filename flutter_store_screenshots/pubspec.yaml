name: flutter_store_screenshots
description: "Harness your Flutter skills to create stunning screenshots for your app store listings. This package provides a collection of tools and utilities to help you capture high-quality screenshots of your Flutter applications, making it easier than ever to showcase your app's features and design in the app stores."
version: 0.1.0
homepage: https://github.com/SEGVeenstra/flutter_store_screenshots
repository: https://github.com/SEGVeenstra/flutter_store_screenshots
issue_tracker: https://github.com/SEGVeenstra/flutter_store_screenshots/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

topics:
  - screenshots
  - store
  - app-store
  - google-play
  - tools

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_frame: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
